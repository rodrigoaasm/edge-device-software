---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - core.apps.local
  resources:
  - mqttlaunchers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - core.apps.local
  resources:
  - mqttlaunchers/finalizers
  verbs:
  - update
- apiGroups:
  - core.apps.local
  resources:
  - mqttlaunchers/status
  verbs:
  - get
  - patch
  - update
