apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf-bridge
  labels:
    app: telegraf-bridge
  namespace: ed-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegraf-bridge
  template:
    metadata:
      labels:
        app: telegraf-bridge
    spec:
      serviceAccountName: telegraf-service
      priorityClassName: default-service
      containers:
      - name: telegraf-bridge
        image: telegraf-bridge
        env:
          - name: DEVICE_ID
            value: "abc123"    
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "128Mi"
            cpu: "100m"