# This rule is not used by the project edge-device-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to core.apps.local resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: edge-device-operator
    app.kubernetes.io/managed-by: kustomize
  name: mqttlauncher-viewer-role
rules:
- apiGroups:
  - core.apps.local
  resources:
  - mqttlaunchers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - core.apps.local
  resources:
  - mqttlaunchers/status
  verbs:
  - get
