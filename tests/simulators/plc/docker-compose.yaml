services:
  ## main
  plc-dev:
    image: docker.io/golang:1.24.2-alpine3.21
    command: [ "tail", "-f", "/dev/null" ]
    volumes:
      - .:/app/plc
      - ./../../../.certs:/certs
    ports:
      - 4841:4841
    environment:
      - DEVICE_ID=ff0001
      - DEVICE_PARENT_ID=dd0001
      - DEVICE_PARENT_URL=opc.tcp://dell-g15:4840
      - OPC_INTERNAL_SERVER_PORT=4841
      - TLS_ENABLE=true    

networks:
  default:
    name: opc-dev