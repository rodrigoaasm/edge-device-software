services:
  camera001:
    build:
      context: ./camera
      dockerfile: Dockerfile
    environment:
      DEVICE_PY_DEVICE_ID: cc0001
      DEVICE_PY_BROKER_HOST: ${DEVICE_PY_BROKER_HOST}
      DEVICE_PY_BROKER_TLS: true
      DEVICE_PY_BROKER_PORT: 30883
      DEVICE_PY_AWS_S3_ENDPOINT: ${DEVICE_PY_AWS_S3_ENDPOINT}
      DEVICE_PY_AWS_DEFAULT_REGION: ${DEVICE_PY_AWS_DEFAULT_REGION}
      DEVICE_PY_AWS_BUCKET_NAME: ${DEVICE_PY_AWS_BUCKET_NAME}
      DEVICE_PY_AWS_ACCESS_KEY_ID: ${DEVICE_PY_AWS_ACCESS_KEY_ID}
      DEVICE_PY_AWS_SECRET_KEY: ${DEVICE_PY_AWS_SECRET_KEY}
    volumes:
      - ../../.certs:/certs
  
  injector001:
    build:
      context: ./plc
      dockerfile: Dockerfile
    ports:
      - "4841:4841"
    environment:
      CAPT_FREQUENCY: 100
      DEVICE_ID: ff0001
      DEVICE_PARENT_ID: dd0001
      DEVICE_PARENT_URL: ${DEVICE_PARENT_URL}
    volumes:
      - ../../.certs:/certs
      
networks:
  default:
    name: devices